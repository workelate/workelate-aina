# Weekly library crawl for the /studio assistant. Refreshes site/data/library.json
# (short excerpts + links from data/library-sources.json) and commits it only when
# the content hash changed. No model call, no secrets: $0 per run. Vercel's GitHub
# integration deploys the commit like any other push to main.
name: crawl-library

on:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl-library
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The crawler and its test are dependency-free; no npm install needed.
      - name: Crawl
        run: node scripts/crawl-library.mjs
      # Retrieval checks read the fresh library, so weekly content drift can
      # fail one; that shows red on the run but never blocks the refresh.
      - name: Offline assistant tests (no network, no key)
        continue-on-error: true
        run: node scripts/test-ask.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- site/data/library.json; then
            echo "library unchanged"
            exit 0
          fi
          git config user.name "we-aina-library-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/library.json
          git commit -m "library: weekly crawl $(date -u +%Y-%m-%d)"
          git push
